<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />

    <meta name="theme-color" content="#e76698" />

    <meta
      name="description"
      content="25 życzeń na 25 urodziny dla mojej ukochanej Celinki ♡"
    />

    <title>Wszystkiego najlepszego, Celinka ♡</title>

    <!-- FAVICON -->
    <link
      rel="icon"
      href="%PUBLIC_URL%/favicon.ico"
    />

    <!-- APPLE -->
    <link
      rel="apple-touch-icon"
      href="%PUBLIC_URL%/logo192.png"
    />

    <!-- MANIFEST -->
    <link
      rel="manifest"
      href="%PUBLIC_URL%/manifest.json"
    />

    <!-- OPEN GRAPH / FACEBOOK / MESSENGER -->
    <meta
      property="og:title"
      content="Wszystkiego najlepszego, Celinka ♡"
    />

    <meta
      property="og:description"
      content="25 życzeń na 25 urodziny. Specjalnie dla Ciebie ♡"
    />

    <meta
      property="og:image"
      content="%PUBLIC_URL%/images/preview.png"
    />

    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:locale"
      content="pl_PL"
    />

    <!-- TWITTER / X / DISCORD -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="Wszystkiego najlepszego, Celinka ♡"
    />

    <meta
      name="twitter:description"
      content="25 życzeń na 25 urodziny. Specjalnie dla Ciebie ♡"
    />

    <meta
      name="twitter:image"
      content="%PUBLIC_URL%/images/preview.png"
    />

  <body>
    <noscript>
      Musisz włączyć JavaScript, aby zobaczyć tę stronę.
    </noscript>

    <div id="root"></div>
